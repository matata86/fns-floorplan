site_name: FNS Floorplan
site_url: https://matata86.github.io/fns-floorplan/
site_description: An animated 2D floor plan card and editor for Home Assistant
repo_url: https://github.com/matata86/fns-floorplan
repo_name: matata86/fns-floorplan
edit_uri: edit/master/docs/
exclude_docs: |
  assets/screenshots/README.md
copyright: Copyright &copy; 2026 matata86, MIT license

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/logo.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - toc.follow
    - content.code.copy
    - content.tabs.link

plugins:
  - search
  - i18n:
      docs_structure: folder
      reconfigure_material: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: cs
          name: Čeština
          build: true
          site_description: Animovaná 2D karta s půdorysem a editor pro Home Assistant
          nav_translations:
            Home: Úvod
            Getting started: Začínáme
            Installation: Instalace
            Quick start: Rychlý start
            Editor: Editor
            Overview: Přehled
            Rooms: Místnosti
            Doors and windows: Dveře a okna
            Items: Položky
            Rules: Pravidla
            Features: Funkce
            Card: Karta
            Room panel: Panel místnosti
            Robot vacuum: Robotický vysavač
            History and check: Historie a kontrola
            Reference: Reference
            Plan format: Formát plánu
            Websocket API: Websocket API
            FAQ: Časté otázky
            Changelog: Změny
            Live demo: Živé demo
        - locale: de
          name: Deutsch
          build: true
          site_description: Eine animierte 2D-Grundriss-Karte mit Editor für Home Assistant
          nav_translations:
            Home: Startseite
            Getting started: Erste Schritte
            Installation: Installation
            Quick start: Schnellstart
            Editor: Editor
            Overview: Übersicht
            Rooms: Räume
            Doors and windows: Türen und Fenster
            Items: Elemente
            Rules: Regeln
            Features: Funktionen
            Card: Karte
            Room panel: Raum-Panel
            Robot vacuum: Saugroboter
            History and check: Verlauf und Prüfung
            Reference: Referenz
            Plan format: Planformat
            Websocket API: Websocket-API
            FAQ: Häufige Fragen
            Changelog: Änderungen
            Live demo: Live-Demo

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.snippets

extra_css:
  - assets/extra.css

nav:
  - Home: index.md
  - Getting started:
      - Installation: installation.md
      - Quick start: quick-start.md
  - Editor:
      - Overview: editor/index.md
      - Rooms: editor/rooms.md
      - Doors and windows: editor/openings.md
      - Items: editor/items.md
      - Rules: editor/rules.md
  - Features:
      - Card: card.md
      - Room panel: room-panel.md
      - Robot vacuum: robot-vacuum.md
      - History and check: history.md
  - Reference:
      - Plan format: reference/plan-format.md
      - Websocket API: reference/websocket-api.md
  - FAQ: faq.md
  - Changelog: changelog.md
  - Live demo: https://matata86.github.io/fns-floorplan/demo/
