site_name: FNS Floorplan
site_url: https://matata86.github.io/fns-floorplan/
site_description: An animated 2D floor plan card and editor for Home Assistant
repo_url: https://github.com/matata86/fns-floorplan
repo_name: matata86/fns-floorplan
edit_uri: edit/master/docs/
exclude_docs: |
  assets/screenshots/README.md
copyright: Copyright &copy; 2026 matata86, MIT license

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/logo.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - toc.follow
    - content.code.copy

plugins:
  - search
  - i18n:
      docs_structure: folder
      reconfigure_material: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: cs
          name: Čeština
          build: true
          site_description: Animovaná 2D karta s půdorysem a editor pro Home Assistant
          nav_translations:
            Home: Úvod
            Getting started: Začínáme
            Installation: Instalace
            Quick start: Rychlý start
            Editor: Editor
            Overview: Přehled
            Rooms: Místnosti
            Doors and windows: Dveře a okna
            Items: Položky
            Rules: Pravidla
            Features: Funkce
            Card: Karta
            Room panel: Panel místnosti
            Robot vacuum: Robotický vysavač
            History and check: Historie a kontrola
            Reference: Reference
            Plan format: Formát plánu
            Websocket API: Websocket API
            FAQ: Časté otázky
            Changelog: Změny
            Live demo: Živé demo
            "Card not found": "Po instalaci se karta nenajde"
            "Custom element doesn't exist": "„Custom element doesn't exist“"
            "Old version after update": "Po aktualizaci stará verze"
            "Card waits for the integration": "Karta čeká na integraci"
            "Plan is empty": "Půdorys je prázdný"
            "Sidebar entry is missing": "V menu chybí položka"
            "Icons are missing": "Chybí ikony"
            "Plan changed meanwhile": "Půdorys se mezitím změnil"
            "Slow or choppy card": "Karta se seká"
            "Wrong light colour": "Světlo svítí jinou barvou"
            "Rule does not apply": "Pravidlo se neuplatní"
            "Texts not translated": "Texty se nepřekládají"
