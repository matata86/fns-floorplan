markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.snippets

extra_css:
  - assets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/matata86/fns-floorplan
      name: GitHub

nav:
  - Home: index.md
  - Getting started:
      - Installation: installation.md
      - Quick start: quick-start.md
  - Card:
      - Card: card.md
      - Room panel: room-panel.md
      - Robot vacuum: robot-vacuum.md
  - Editor:
      - Overview: editor/index.md
      - Rooms: editor/rooms.md
      - Doors and windows: editor/openings.md
      - Items: editor/items.md
      - Rules: editor/rules.md
      - History and check: history.md
  - When something doesn't work:
      - All topics: faq.md
      - Card not found: help/card-not-found.md
      - Custom element doesn't exist: help/custom-element-missing.md
      - Old version after update: help/old-version-after-update.md
      - Card waits for the integration: help/waiting-for-integration.md
      - Plan is empty: help/plan-empty.md
      - Sidebar entry is missing: help/sidebar-entry-missing.md
      - Icons are missing: help/icons-missing.md
      - Plan changed meanwhile: help/plan-conflict.md
      - Slow or choppy card: help/performance.md
      - Wrong light colour: help/light-wrong-colour.md
      - Rule does not apply: help/rule-not-applied.md
      - Texts not translated: help/languages.md
      - Still not working: help/still-not-working.md
  - Reference:
      - Plan format: reference/plan-format.md
      - Websocket API: reference/websocket-api.md
  - Changelog: changelog.md
  - Live demo: https://matata86.github.io/fns-floorplan/demo/
