<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FNS Floorplan live demo</title>
<link rel="icon" href="data:,">
<style>
__HA_THEME__
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--primary-background-color); color: var(--primary-text-color); font: 14px/1.4 var(--ha-font-family-body); min-height: 100vh; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; }
button:focus-visible, a:focus-visible { outline: 2px solid var(--primary-color); outline-offset: 2px; }

/* top app bar as in Home Assistant */
.appbar { position: sticky; top: 0; z-index: 5; height: 56px; display: flex; align-items: center; gap: 4px; padding: 0 8px 0 4px;
  background: var(--app-header-background-color); border-bottom: var(--app-header-border-bottom); }
.appbar h1 { flex: 1; margin: 0 0 0 4px; font-size: 20px; font-weight: 400; letter-spacing: .01em; }
.ibtn { width: 40px; height: 40px; border: 0; background: none; border-radius: 50%; display: grid; place-items: center; cursor: pointer; color: var(--primary-text-color); --mdc-icon-size: 24px; }
.ibtn:hover { background: color-mix(in srgb, var(--primary-text-color) 8%, transparent); }
span.ibtn { cursor: default; color: var(--secondary-text-color); }
span.ibtn:hover { background: none; }
.langs { display: flex; margin: 0 4px; border: 1px solid var(--divider-color); border-radius: 18px; padding: 2px; }
.langs a { padding: 5px 10px; border-radius: 16px; color: var(--secondary-text-color); text-decoration: none; font-size: 12px; font-weight: 500; }
.langs a[aria-current="true"] { background: var(--primary-color); color: var(--text-primary-color); }

/* dashboard view */
.view { display: grid; grid-template-columns: min(900px, calc((100vh - 168px) * 0.98)) 300px; gap: 16px; justify-content: center; align-items: start; padding: 16px 16px 8px; }
.hacard { background: var(--card-background-color); border: var(--ha-card-border-width) solid var(--ha-card-border-color); border-radius: var(--ha-card-border-radius); box-shadow: var(--ha-card-box-shadow, none); overflow: hidden; }
#card fns-floorplan-card { display: block; }
.panel { padding: 14px 16px 16px; }
.panel h2 { margin: 0 0 2px; font-size: 16px; font-weight: 500; }
.panel p { margin: 0 0 12px; color: var(--secondary-text-color); font-size: 12px; }
.chips { display: grid; grid-template-columns: 1fr; gap: 6px; }
.chip { display: flex; align-items: center; gap: 10px; padding: 5px 10px; background: var(--card-background-color); border: 1px solid var(--divider-color); border-radius: 12px; cursor: pointer; text-align: left; min-width: 0; }
.chip:hover { background: color-mix(in srgb, var(--primary-text-color) 4%, var(--card-background-color)); }
.chip .ic { --c: var(--state-inactive-color); width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; flex: none; background: color-mix(in srgb, var(--c) 20%, transparent); color: var(--c); transition: background .3s, color .3s; }
.chip[aria-pressed="true"] .ic { --c: var(--on); }
.chip .tx { display: flex; flex-direction: column; min-width: 0; }
.chip .n { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chip .s { font-size: 12px; color: var(--secondary-text-color); }
.foot { grid-column: 1 / -1; text-align: center; color: var(--secondary-text-color); font-size: 12px; padding: 0 8px 12px; }
.foot a { color: var(--primary-color); }
@media (max-width: 960px) {
  .view { grid-template-columns: minmax(0, 1fr); max-width: 900px; margin: 0 auto; padding: 8px 8px 8px; gap: 8px; }
  .chips { grid-template-columns: 1fr 1fr; }
  .panel { padding: 12px; }
}
@media (max-width: 400px) { .chips { grid-template-columns: 1fr; } .appbar h1 { font-size: 18px; } .langs a { padding: 5px 8px; } }
</style>
</head>
<body>
<header class="appbar">
  <span class="ibtn" aria-hidden="true"><ha-icon icon="mdi:menu"></ha-icon></span>
  <h1 id="title">Home</h1>
  <nav class="langs" id="langs" aria-label="Language"><a href="?lang=en">EN</a><a href="?lang=cs">CS</a><a href="?lang=de">DE</a><a href="?lang=pl">PL</a></nav>
  <button class="ibtn" id="theme" type="button" aria-label="Theme"><ha-icon icon="mdi:weather-night"></ha-icon></button>
  <span class="ibtn" aria-hidden="true"><ha-icon icon="mdi:magnify"></ha-icon></span>
  <span class="ibtn" aria-hidden="true"><ha-icon icon="mdi:dots-vertical"></ha-icon></span>
</header>
<main class="view">
  <div class="hacard" id="card"></div>
  <section class="hacard panel" aria-labelledby="ptitle">
    <h2 id="ptitle"></h2>
    <p id="phint"></p>
    <div class="chips" id="actions"></div>
  </section>
  <div class="foot" id="foot"></div>
</main>

<script>window.FP_ICONS = __ICONS__;</script>
<script type="module">
// icons asked for through <ha-icon>/the plan: mdi:thermometer mdi:water-percent mdi:history mdi:close mdi:floor-plan mdi:door-closed mdi:door-open mdi:window-closed-variant mdi:window-open-variant
const LANGS = ["en", "cs", "de", "pl"];
const params = new URLSearchParams(location.search);
const lang = LANGS.includes(params.get("lang")) ? params.get("lang") : (LANGS.find((l) => (navigator.language || "").startsWith(l)) || "en");
document.documentElement.lang = lang; // before the card module is imported

const TEXT = {
  en: {
    home: "Home", controls: "Demo controls", hint: "Tap a chip, or a room and a light in the plan.",
    foot: "This is a demo with fake data. Install: HACS → Custom repositories → matata86/fns-floorplan", docs: "Documentation",
    c: { lights: "Lights", door: "Front door", window: "Window", blind: "Blind", vacuum: "Vacuum", washer: "Washing machine", dishwasher: "Dishwasher", motion: "Motion", alarm: "Alarm", daynight: "Day / Night" },
    w: { on: "On", off: "Off", open: "Open", closed: "Closed", detected: "Detected", clear: "Clear", running: "Running", heating: "Heating", cleaning: "Cleaning", docked: "Docked", returning: "Returning", paused: "Paused", armed_home: "Armed home", triggered: "Triggered", playing: "Playing", idle: "Idle", locked: "Locked", unlocked: "Unlocked", min: "min", day: "Day", night: "Night" },
    out: "°C outside",
    n: { "Flat": "Flat", "Living room": "Living room", "Kitchen": "Kitchen", "Hall": "Hall", "Bathroom": "Bathroom", "Bedroom": "Bedroom", "Radiator": "Radiator", "Dishwasher": "Dishwasher", "Washing machine": "Washing machine", "Alarm": "Alarm", "Camera": "Camera", "Fireplace": "Fireplace" },
    e: ["Ceiling light", "LED strip", "Spotlight", "Kitchen light", "Hall light", "Bathroom light", "Bedside lamp", "Front door", "Bathroom door", "Living room window", "Bedroom window", "Blind", "Front door lock", "Motion", "Washing machine", "Dishwasher", "Thermostat", "Alarm", "Hall camera", "Fireplace", "TV", "Robot vacuum"],
  },
  cs: {
    home: "Domov", controls: "Ovládání dema", hint: "Klepněte na dlaždici, nebo na místnost či světlo v plánu.",
    foot: "Toto je demo s vymyšlenými daty. Instalace: HACS → Vlastní repozitáře → matata86/fns-floorplan", docs: "Dokumentace",
    c: { lights: "Světla", door: "Vchodové dveře", window: "Okno", blind: "Roleta", vacuum: "Vysavač", washer: "Pračka", dishwasher: "Myčka", motion: "Pohyb", alarm: "Alarm", daynight: "Den / Noc" },
    w: { on: "Zapnuto", off: "Vypnuto", open: "Otevřeno", closed: "Zavřeno", detected: "Zaznamenán", clear: "Klid", running: "Běží", heating: "Topí", cleaning: "Uklízí", docked: "V doku", returning: "Vrací se", paused: "Pozastaveno", armed_home: "Zabezpečeno doma", triggered: "Spuštěn", playing: "Hraje", idle: "Nečinný", locked: "Zamčeno", unlocked: "Odemčeno", min: "min", day: "Den", night: "Noc" },
    out: "°C venku",
    n: { "Flat": "Byt", "Living room": "Obývák", "Kitchen": "Kuchyň", "Hall": "Chodba", "Bathroom": "Koupelna", "Bedroom": "Ložnice", "Radiator": "Radiátor", "Dishwasher": "Myčka", "Washing machine": "Pračka", "Alarm": "Alarm", "Camera": "Kamera", "Fireplace": "Krb" },
    e: ["Stropní světlo", "LED pásek", "Bodovka", "Světlo v kuchyni", "Světlo v chodbě", "Světlo v koupelně", "Noční lampička", "Vchodové dveře", "Dveře do koupelny", "Okno v obýváku", "Okno v ložnici", "Roleta", "Zámek dveří", "Pohyb", "Pračka", "Myčka", "Termostat", "Alarm", "Kamera v chodbě", "Krb", "Televize", "Robotický vysavač"],
  },
  de: {
    home: "Zuhause", controls: "Demo-Steuerung", hint: "Tippe auf eine Kachel, oder auf Raum und Licht im Plan.",
    foot: "Dies ist eine Demo mit erfundenen Daten. Installation: HACS → Benutzerdefinierte Repositories → matata86/fns-floorplan", docs: "Dokumentation",
    c: { lights: "Lichter", door: "Haustür", window: "Fenster", blind: "Rollo", vacuum: "Saugroboter", washer: "Waschmaschine", dishwasher: "Geschirrspüler", motion: "Bewegung", alarm: "Alarm", daynight: "Tag / Nacht" },
    w: { on: "An", off: "Aus", open: "Offen", closed: "Geschlossen", detected: "Erkannt", clear: "Ruhig", running: "Läuft", heating: "Heizt", cleaning: "Saugt", docked: "In Station", returning: "Kehrt zurück", paused: "Pausiert", armed_home: "Scharf (zu Hause)", triggered: "Ausgelöst", playing: "Spielt", idle: "Leerlauf", locked: "Verriegelt", unlocked: "Entriegelt", min: "Min.", day: "Tag", night: "Nacht" },
    out: "°C draußen",
    n: { "Flat": "Wohnung", "Living room": "Wohnzimmer", "Kitchen": "Küche", "Hall": "Flur", "Bathroom": "Bad", "Bedroom": "Schlafzimmer", "Radiator": "Heizkörper", "Dishwasher": "Geschirrspüler", "Washing machine": "Waschmaschine", "Alarm": "Alarm", "Camera": "Kamera", "Fireplace": "Kamin" },
    e: ["Deckenlicht", "LED-Streifen", "Spot", "Küchenlicht", "Flurlicht", "Badlicht", "Nachttischlampe", "Haustür", "Badezimmertür", "Wohnzimmerfenster", "Schlafzimmerfenster", "Rollo", "Türschloss", "Bewegung", "Waschmaschine", "Geschirrspüler", "Thermostat", "Alarm", "Flurkamera", "Kamin", "Fernseher", "Saugroboter"],
  },
  pl: {
    home: "Dom", controls: "Sterowanie demonstracją", hint: "Dotknij kafelka albo pomieszczenia i światła na planie.",
    foot: "To demo ze zmyślonymi danymi. Instalacja: HACS → Repozytoria niestandardowe → matata86/fns-floorplan", docs: "Dokumentacja",
    c: { lights: "Światła", door: "Drzwi wejściowe", window: "Okno", blind: "Roleta", vacuum: "Odkurzacz", washer: "Pralka", dishwasher: "Zmywarka", motion: "Ruch", alarm: "Alarm", daynight: "Dzień / Noc" },
    w: { on: "Włączone", off: "Wyłączone", open: "Otwarte", closed: "Zamknięte", detected: "Wykryto", clear: "Brak", running: "Działa", heating: "Grzeje", cleaning: "Sprząta", docked: "W stacji", returning: "Wraca", paused: "Wstrzymane", armed_home: "Uzbrojony (w domu)", triggered: "Wyzwolony", playing: "Odtwarzanie", idle: "Bezczynny", locked: "Zamknięty", unlocked: "Otwarty", min: "min", day: "Dzień", night: "Noc" },
    out: "°C na zewnątrz",
    n: { "Flat": "Mieszkanie", "Living room": "Salon", "Kitchen": "Kuchnia", "Hall": "Przedpokój", "Bathroom": "Łazienka", "Bedroom": "Sypialnia", "Radiator": "Grzejnik", "Dishwasher": "Zmywarka", "Washing machine": "Pralka", "Alarm": "Alarm", "Camera": "Kamera", "Fireplace": "Kominek" },
    e: ["Lampa sufitowa", "Taśma LED", "Reflektor", "Światło w kuchni", "Światło w przedpokoju", "Światło w łazience", "Lampka nocna", "Drzwi wejściowe", "Drzwi do łazienki", "Okno w salonie", "Okno w sypialni", "Roleta", "Zamek drzwi", "Ruch", "Pralka", "Zmywarka", "Termostat", "Alarm", "Kamera w przedpokoju", "Kominek", "Telewizor", "Odkurzacz automatyczny"],
  },
}[lang];
const W = TEXT.w;

// ---- fake <ha-card> and <ha-icon>: what Home Assistant provides and the card relies on ----
customElements.define("ha-card", class extends HTMLElement {
  constructor() { super(); this.attachShadow({ mode: "open" }).innerHTML = "<style>:host{display:block}</style><slot></slot>"; }
});
// The card writes <ha-icon icon="mdi:…"> as an ATTRIBUTE (the room panel uses the property), so both must work
class FakeIcon extends HTMLElement {
  static get observedAttributes() { return ["icon"]; }
  constructor() { super(); this.attachShadow({ mode: "open" }).innerHTML = '<style>:host{display:inline-flex;width:var(--mdc-icon-size,24px);height:var(--mdc-icon-size,24px);vertical-align:middle;flex:none}svg{width:100%;height:100%;fill:currentColor}</style><svg viewBox="0 0 24 24"><path/></svg>'; }
  set icon(v) { this._icon = v; this.draw(); }
  get icon() { return this._icon ?? this.getAttribute("icon"); }
  set stateObj(v) { this._so = v; this.draw(); }
  attributeChangedCallback() { this.draw(); }
  connectedCallback() { this.draw(); }
  draw() {
    const d = window.FP_ICONS[this.icon || this._so?.attributes?.icon];
    this.shadowRoot.querySelector("path").setAttribute("d", d || "");
  }
}
customElements.define("ha-icon", FakeIcon);
customElements.define("ha-state-icon", class extends FakeIcon {});

// ---- the invented flat: one plan.json with English names, translated here ----
const plan = await (await fetch("./plan.json")).json();
const tn = (s) => TEXT.n[s] || s;
for (const l of plan.levels) l.name = tn(l.name);
for (const r of plan.rooms) r.name = tn(r.name);
for (const d of plan.devices) d.name = tn(d.name);
for (const t of plan.texts) t.text = t.text.replace("°C outside", TEXT.out);

const root = document.documentElement;
const now = Date.now(), ago = (min) => new Date(now - min * 60e3).toISOString();
const ENT = ["light.living_room", "light.living_strip", "light.living_spot", "light.kitchen", "light.hall", "light.bathroom", "light.bedroom",
  "binary_sensor.front_door", "binary_sensor.bathroom_door", "binary_sensor.living_room_window", "binary_sensor.bedroom_window", "cover.living_room_blind", "lock.front_door",
  "binary_sensor.living_room_motion", "binary_sensor.washing_machine", "sensor.dishwasher_state", "climate.living_room", "alarm_control_panel.home", "camera.hall", "switch.fireplace", "media_player.tv", "vacuum.robot"];
const NAME = Object.fromEntries(ENT.map((id, i) => [id, TEXT.e[i]]));
const S = (state, attributes = {}, minutes = 30) => ({ state, attributes, last_changed: ago(minutes) });
const LT = (state, brightness, extra, modes) => S(state, { ...(state === "on" ? { brightness } : {}), color_mode: "color_temp", color_temp_kelvin: 2700, supported_color_modes: modes || ["color_temp"], ...extra });
const states = {
  "light.living_room": LT("on", 220),
  "light.living_strip": LT("on", 255, { color_mode: "rgb", rgb_color: [255, 120, 60] }, ["rgb"]),
  "light.living_spot": LT("on", 200, { color_temp_kelvin: 3000 }),
  "light.kitchen": LT("off"),
  "light.hall": LT("off"),
  "light.bathroom": LT("off", 0, {}, ["brightness"]),
  "light.bedroom": LT("on", 90, { color_mode: "hs", rgb_color: [255, 170, 90] }, ["hs"]),
  "binary_sensor.front_door": S("off", { device_class: "door" }),
  "binary_sensor.bathroom_door": S("off", { device_class: "door" }),
  "binary_sensor.living_room_window": S("off", { device_class: "window" }),
  "binary_sensor.bedroom_window": S("on", { device_class: "window" }, 3),
  "cover.living_room_blind": S("open", { current_position: 35, device_class: "blind" }),
  "lock.front_door": S("locked"),
  "binary_sensor.living_room_motion": S("off", { device_class: "motion" }),
  "binary_sensor.washing_machine": S("off"),
  "sensor.dishwasher_state": S("run"),
  "sensor.dishwasher_remaining": S("47", { unit_of_measurement: "min" }),
  "timer.dishwasher": S("active", { duration: "2:00:00", finishes_at: new Date(now + 47 * 60e3).toISOString() }),
  "climate.living_room": S("heat", { hvac_action: "heating", current_temperature: 21.4, temperature: 22.5 }),
  "alarm_control_panel.home": S("armed_home"),
  "camera.hall": S("idle"),
  "switch.fireplace": S("on"),
  "media_player.tv": S("playing", { media_title: "Evening news", device_class: "tv" }),
  "vacuum.robot": S("docked"),
  "sensor.robot_current_room": S("Living room", { options: ["Living room", "Kitchen"] }),
  "sensor.robot_battery": S("100", { device_class: "battery", unit_of_measurement: "%" }),
  "sensor.living_room_temperature": S("21.4", { device_class: "temperature", unit_of_measurement: "°C" }),
  "sensor.living_room_humidity": S("46", { device_class: "humidity", unit_of_measurement: "%" }),
  "sensor.kitchen_temperature": S("22.6", { device_class: "temperature", unit_of_measurement: "°C" }),
  "sensor.bedroom_temperature": S("19.8", { device_class: "temperature", unit_of_measurement: "°C" }),
  "sensor.bathroom_humidity": S("58", { device_class: "humidity", unit_of_measurement: "%" }),
  "sensor.outdoor_temperature": S("12.4", { device_class: "temperature", unit_of_measurement: "°C" }),
  "sun.sun": S("above_horizon"),
};
for (const [id, s] of Object.entries(states)) { s.entity_id = id; s.attributes.friendly_name = NAME[id] || id; }
const set = (id, state, extra = {}) => {
  const o = states[id];
  states[id] = { ...o, state, last_changed: new Date().toISOString(), attributes: { ...o.attributes, ...extra } };
};
const LIGHTS = ENT.filter((e) => e.startsWith("light."));
const lastBr = {};
const lightOn = (id, br) => set(id, "on", { brightness: br ?? lastBr[id] ?? 220 });
const lightOff = (id) => {
  const o = states[id], a = { ...o.attributes };
  if (a.brightness) lastBr[id] = a.brightness;
  delete a.brightness;
  states[id] = { ...o, state: "off", last_changed: new Date().toISOString(), attributes: a };
};

// ---- fake behaviour: dishwasher countdown, vacuum run ----
const dishLeft = () => Math.max(0, Math.ceil((Date.parse(states["timer.dishwasher"].attributes.finishes_at || 0) - Date.now()) / 60e3));
function dish(on) {
  if (on) { set("sensor.dishwasher_state", "run"); set("timer.dishwasher", "active", { finishes_at: new Date(Date.now() + 47 * 60e3).toISOString() }); set("sensor.dishwasher_remaining", "47"); }
  else { set("sensor.dishwasher_state", "off"); set("timer.dishwasher", "idle", { finishes_at: null }); set("sensor.dishwasher_remaining", "0"); }
}
let vacT = 0;
function vac(go) {
  clearTimeout(vacT);
  if (go) set("vacuum.robot", "cleaning");
  else if (states["vacuum.robot"].state === "cleaning") {
    set("vacuum.robot", "returning");
    vacT = setTimeout(() => { set("vacuum.robot", "docked"); set("sensor.robot_current_room", "Living room"); push(); }, 9000);
  }
}
setInterval(() => { // the robot moves between rooms; the dishwasher counts down
  if (states["vacuum.robot"].state === "cleaning") set("sensor.robot_current_room", states["sensor.robot_current_room"].state === "Kitchen" ? "Living room" : "Kitchen");
  if (states["sensor.dishwasher_state"].state === "run") { const m = dishLeft(); m ? set("sensor.dishwasher_remaining", String(m)) : dish(false); }
  push();
}, 6000);

// ---- fake hass ----
let hass, card;
const subs = [];
const renderTpl = (t) => t.replace(/\{\{\s*states\('([^']+)'\)\s*\}\}/g, (_, id) => states[id]?.state ?? "unknown");
// a day of history for the replay tool (hours ago → state)
const H = (h) => Date.now() / 1000 - h * 3600;
const HIST = {
  "light.living_room": [[24, "off"], [20.5, "on"], [17, "off"], [5, "on"]], "light.kitchen": [[24, "off"], [22, "on"], [21.2, "off"], [9, "on"], [8.4, "off"]],
  "light.bedroom": [[24, "off"], [3.5, "on"]], "light.hall": [[24, "off"], [19.2, "on"], [19.1, "off"], [8.7, "on"], [8.6, "off"]], "light.bathroom": [[24, "off"], [8.8, "on"], [8.5, "off"]],
  "light.living_strip": [[24, "off"], [20.5, "on"], [17, "off"], [5, "on"]], "light.living_spot": [[24, "off"], [5, "on"]],
  "binary_sensor.front_door": [[24, "off"], [19.2, "on"], [19.1, "off"], [8.7, "on"], [8.6, "off"]], "binary_sensor.bedroom_window": [[24, "off"], [6, "on"], [4, "off"], [0.05, "on"]],
  "binary_sensor.living_room_motion": [[24, "off"], [20.4, "on"], [20.3, "off"], [5, "on"], [4.9, "off"]], "binary_sensor.washing_machine": [[24, "off"], [15, "on"], [13.8, "off"]],
  "sensor.living_room_temperature": [[24, "20.2"], [16, "20.6"], [10, "21.1"], [4, "21.7"], [1, "21.4"]], "sensor.kitchen_temperature": [[24, "21.5"], [12, "22.0"], [9, "23.1"], [1, "22.6"]],
  "sensor.bedroom_temperature": [[24, "19.4"], [12, "19.1"], [1, "19.8"]], "sensor.outdoor_temperature": [[24, "8.1"], [14, "13.6"], [6, "10.2"], [1, "12.4"]],
};
hass = {
  entities: { "vacuum.robot": { entity_id: "vacuum.robot", device_id: "robot" }, "sensor.robot_battery": { entity_id: "sensor.robot_battery", device_id: "robot" } },
  connection: {
    subscribeMessage(cb, msg) {
      if (msg.type === "fns_floorplan/plan/subscribe") setTimeout(() => cb(plan));
      else if (msg.type === "render_template") { const s = { cb, t: msg.template }; subs.push(s); setTimeout(() => cb({ result: renderTpl(s.t) })); return Promise.resolve(() => subs.splice(subs.indexOf(s), 1)); }
      return Promise.resolve(() => {});
    },
    addEventListener() {},
  },
  async callWS(msg) {
    if (msg.type !== "history/history_during_period") throw new Error("demo");
    return Object.fromEntries(Object.entries(HIST).map(([id, list]) => [id, list.map(([h, s], i) => ({ s, lu: H(h), ...(i === 0 ? { a: { ...states[id].attributes, ...(s === "on" && id.startsWith("light.") ? { brightness: 220 } : {}) } } : {}) }))]));
